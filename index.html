<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <!-- 视口设置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- SEO 优化 -->
    <title>iNews - 专业的新闻聚合平台</title>
    <meta name="description" content="iNews 是一个现代化的新闻聚合平台，提供最新、最全面的新闻资讯，支持个性化推荐和收藏功能。" />
    <meta name="keywords" content="新闻,资讯,聚合,阅读,科技,体育,娱乐,财经" />
    <meta name="author" content="iNews Team" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="iNews - 专业的新闻聚合平台" />
    <meta property="og:description" content="发现最新资讯，个性化新闻阅读体验" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inews.app" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iNews - 专业的新闻聚合平台" />
    <meta name="twitter:description" content="发现最新资讯，个性化新闻阅读体验" />
    <meta name="twitter:image" content="/twitter-image.png" />
    
    <!-- PWA 支持 -->
    <meta name="theme-color" content="#ff4444" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="iNews" />
    
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- 启动样式 -->
    <style>
      /* 启动加载样式 */
      #root {
        min-height: 100vh;
      }
      
      .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      .loading-text {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 10px;
      }
      
      .loading-subtext {
        font-size: 14px;
        opacity: 0.8;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* 基础重置 */
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f5f5f5;
        color: #333;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 启动加载界面 -->
      <div class="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">iNews</div>
        <div class="loading-subtext">加载中...</div>
      </div>
    </div>
    
    <!-- noscript 支持 -->
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript 已禁用</h1>
        <p>iNews 需要 JavaScript 才能正常运行。请启用 JavaScript 后刷新页面。</p>
        <a href="/" style="color: #ff4444; text-decoration: underline;">刷新页面</a>
      </div>
    </noscript>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
